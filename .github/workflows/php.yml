name: php

on:
  push:
    branches: [main]
    paths: ['php/**', 'spec/**', 'composer.json', 'composer.lock', '.php-cs-fixer.dist.php', '.github/workflows/php.yml']
  pull_request:
    paths: ['php/**', 'spec/**', 'composer.json', 'composer.lock', '.php-cs-fixer.dist.php', '.github/workflows/php.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: composer cs
      - run: composer analyse
      - run: composer test:unit

      # Optional: set the repository secret CHECKOUT_SANDBOX_ENV to the
      # content of a checkout sandbox .env (see php/.env.example).
      - name: Sandbox integration tests
        env:
          SANDBOX_ENV: ${{ secrets.CHECKOUT_SANDBOX_ENV }}
        if: env.SANDBOX_ENV != '' && matrix.php == '8.3'
        run: |
          printf '%s\n' "$SANDBOX_ENV" > php/.env
          vendor/bin/phpunit -c php/phpunit.xml.dist --group integration
