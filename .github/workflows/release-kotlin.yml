# Publishes kotlin/ (io.github.kechankrisna:payway-checkout) to Maven Central
# when a tag like kotlin-v2.0.1 is pushed. The tag must equal VERSION_NAME in
# kotlin/gradle.properties.
#
# One-time setup: verify the io.github.kechankrisna namespace on
# central.sonatype.com, generate a user token, create a GPG signing key, and
# add the repository secrets MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD
# (the token), SIGNING_KEY (ASCII-armored private key) and SIGNING_PASSWORD.
name: release-kotlin

on:
  push:
    tags: ['kotlin-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

defaults:
  run:
    working-directory: kotlin

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Gradle version
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "kotlin-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION_NAME=$version in kotlin/gradle.properties"
            exit 1
          fi

      - name: Secrets are set
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see the comment at the top of release-kotlin.yml)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
