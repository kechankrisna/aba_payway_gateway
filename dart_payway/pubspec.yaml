name: dart_payway
description: ABA PayWay Ecommerce Checkout client for Dart and Flutter. Purchase, check, close, refund and list transactions, exchange rates, and verify callbacks.
version: 2.0.0
repository: https://github.com/kechankrisna/aba_payway_gateway/tree/main/dart_payway
issue_tracker: https://github.com/kechankrisna/aba_payway_gateway/issues
topics:
  - payment
  - payway
  - aba
  - cambodia

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.3
  dio: ^5.4.0
  json_annotation: ^4.12.0
  pointycastle: ^4.0.0

dev_dependencies:
  build_runner: ^2.16.1
  dotenv: ^4.1.0
  json_serializable: ^6.14.1
  lints: ^6.0.0
  test: ^1.26.0

# throwaway RSA keys used only by the offline unit tests (see test/fixtures/README.md)
false_secrets:
  - /test/fixtures/*.pem
