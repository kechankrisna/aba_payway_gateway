name: flutter_payway
description: >-
  Flutter widgets for ABA PayWay checkout, built on dart_payway: a payment
  method picker with the ABA PAY, KHQR and card logos.
version: 2.0.0
repository: https://github.com/kechankrisna/payway-checkout/tree/main/flutter
issue_tracker: https://github.com/kechankrisna/payway-checkout/issues
topics: [payway, aba, payment, khqr, cambodia]

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dart_payway: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
